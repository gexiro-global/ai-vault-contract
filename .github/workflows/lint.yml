name: Lint

on:
  push:
  pull_request:

jobs:
  vault-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the example vault
        run: python tools/lint_vault.py .
      - name: Test the linter
        run: python tools/test_lint_vault.py
