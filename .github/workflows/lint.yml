name: Lint

on:
  push:
  pull_request:

jobs:
  vault-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the example vault
        run: python tools/lint_vault.py .
      - name: Test the linter
        run: python tools/test_lint_vault.py

  secret-scan:
    # The vault linter only inspects notes. A secret committed to a template, a workflow or the
    # README would never be looked at - so scan the whole repository, history included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid licence for organisation-owned repos. The
      # scanner itself is free, so run the released binary directly.
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
      - name: Scan the full history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
